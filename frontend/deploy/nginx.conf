server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Slightly above the backend's 5 MB upload limit so the backend returns the proper 413 message.
    client_max_body_size 6m;

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    # Same-origin API: the browser never talks to the backend container directly.
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI analysis can take a few seconds on CPU.
        proxy_read_timeout 60s;
    }

    # Hashed bundles never change, so cache them for a long time.
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths fall back to index.html (Expo Router handles routing).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
