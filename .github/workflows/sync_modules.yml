name: Sync Modules

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - folder: 'frontend'
            repo: 'wearwise-frontend'
          - folder: 'backend'
            repo: 'wearwise-backend'
          - folder: 'ai_engine'
            repo: 'wearwise-ai'

    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4
        with:
          path: monorepo
          lfs: true

      - name: Checkout Module Repo
        uses: actions/checkout@v4
        with:
          repository: wearwiseteam/${{ matrix.repo }}
          token: ${{ secrets.SYNC_TOKEN_CLASSIC || secrets.SYNC_TOKEN }}
          path: ${{ matrix.repo }}
          fetch-depth: 0
          lfs: true

      - name: Sync Files
        run: |
          # Curățăm repo-ul destinație (fără .git)
          find ${{ matrix.repo }} -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
          
          # Copiem conținutul din monorepo în repo-ul destinație (inclusiv .gitignore)
          cp -a monorepo/${{ matrix.folder }}/. ${{ matrix.repo }}/
          
          # Copiem și configurările LFS globale pentru ca referințele binare să fie păstrate corect
          if [ -f "monorepo/.gitattributes" ]; then
            cp monorepo/.gitattributes ${{ matrix.repo }}/
          fi
          
          # Intrăm în repo-ul destinație
          cd ${{ matrix.repo }}
          
          # Configurăm Git
          git config user.name "WearWise Bot"
          git config user.email "bot@wearwise.team"
          
          # Adăugăm fișierele (Git va respecta automat .gitignore-ul din folder etc)
          # Asta va rula clean filters pentru LFS și va genera obiectele LFS în .git-ul local
          git add -A
          
          # FORȚĂM O UPLOADARE LFS! Chiar dacă fișierele text (pointerii) sunt la fel și commit-ul nu s-ar face, 
          # fișierul binar real trebuie trimis către Hugging Face / modulul remote.
          git lfs push origin HEAD:${GITHUB_REF#refs/heads/} --all || true
          
          # Commit și Push la schimbările pur de text (dacă există)
          if git diff --staged --quiet; then
            echo "Nicio schimbare TEXT de sincronizat pentru ${{ matrix.folder }} (dar LFS-ul a fost actualizat!)."
          else
            git commit -m "Mirror sync from monorepo (Branch: ${GITHUB_REF#refs/heads/})"
            git push origin HEAD:${GITHUB_REF#refs/heads/} --force
          fi
