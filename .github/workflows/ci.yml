name: WearWise CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
      - run: npm install
        working-directory: backend
      - run: npm test
        working-directory: backend

  ai-engine-check:
    runs-on: ubuntu-latest
    steps:
      # lfs: true — without it the checkpoint is a pointer file and the image build fails by design.
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Build image
        run: docker build -t wearwise-ai ai_engine
      - name: Start container and wait for models to load
        run: |
          docker run -d --name ai -p 7860:7860 wearwise-ai
          for i in $(seq 1 60); do
            if curl -fs http://localhost:7860/health | grep -q '"ready":true'; then
              echo "AI engine ready"; exit 0
            fi
            sleep 5
          done
          docker logs ai
          exit 1
