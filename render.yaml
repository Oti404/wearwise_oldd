# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  # This static site configuration helps Render correctly serve the 
  # WearWise Expo Web single page application. 
  # It intercepts 404s and rewrites them to index.html, fixing 
  # the 'refresh 404' bug out-of-the-box.
  - type: web
    name: wearwise-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npx expo export -p web && printf '/*\t/index.html\t200\n' > dist/_redirects
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
